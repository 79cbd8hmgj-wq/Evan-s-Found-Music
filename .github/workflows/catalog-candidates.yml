name: Candidate replenishment proposal

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desired eligible candidate inventory (not a guaranteed yield)
        required: true
        default: "1000"
        type: string
  schedule:
    - cron: "30 9 * * 1"
  pull_request:
    paths:
      - "src/found_music/candidate_discovery.py"
      - "scripts/replenish_candidates.py"
      - "data/catalog_queries.txt"
      - ".github/workflows/catalog-candidates.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Catalog proposal
        env:
          REQUESTED_TARGET: ${{ inputs.target || '1000' }}
          EVENT_KIND: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_KIND" == "pull_request" ]]; then
            # Propose a real replenished candidate inventory on this feature branch.
            python scripts/replenish_candidates.py --target 1000 --pause 0.7 --apply --report candidate-report.json
            python scripts/validate_data.py
          else
            if ! [[ "$REQUESTED_TARGET" =~ ^[0-9]+$ ]]; then
              echo "target must be a positive integer" >&2
              exit 1
            fi
            python scripts/replenish_candidates.py --target "$REQUESTED_TARGET" --pause 0.7 --apply --report candidate-report.json
            python scripts/validate_data.py
          fi
      - name: Commit candidate proposal to feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: replenish verified eligible catalog candidate inventory"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: found-music-catalog-proposal-${{ github.run_id }}
          path: |
            candidate-report.json
            data/candidates.csv
          retention-days: 30
