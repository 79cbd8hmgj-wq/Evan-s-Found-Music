name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_data.py
      - run: pytest -q
      - name: Evaluate current model
        run: python scripts/evaluate_model.py
      - name: Backtest historical rounds
        run: python scripts/backtest_rounds.py
      - name: Compare scoring v1 vs v2
        run: python scripts/compare_scoring.py
