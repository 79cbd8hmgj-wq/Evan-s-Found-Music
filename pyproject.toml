[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evans-found-music"
version = "0.1.0"
description = "A diversity-aware personal music recommender for Found Music."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
found-music = "found_music.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
